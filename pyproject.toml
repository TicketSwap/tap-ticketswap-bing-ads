[build-system]
requires = [
    "hatchling>=1,<2",
    "hatch-vcs>=0.5",
]
build-backend = "hatchling.build"

[project]
name = "tap-ticketswap-bing-ads"
dynamic = ["version"]
description = "Singer tap for Microsoft (Bing) Ads, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Jakob Chumtong", email = "jakob.chumtong@ticketswap.com" }]
keywords = [
    "ELT",
    "Bing Ads",
    "Microsoft Ads",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
requires-python = ">=3.10,<3.13"
dependencies = [
    "singer-sdk~=0.54.9",
    "bingads>=13.0.30.1",
    "typing-extensions>=4.16.0; python_version < '3.13'",
]

[project.scripts]
# CLI declaration
tap-ticketswap-bing-ads = 'tap_ticketswap_bing_ads.tap:TapBingAds.cli'

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=9.1.1",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "singer-sdk[testing]",
]
typing = [
    "mypy>=2.4.0",
    "types-requests",
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["tap_ticketswap_bing_ads"]

[tool.mypy]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["bingads.*", "suds.*"]
ignore_missing_imports = true

[tool.pytest]
addopts = [
    "-ra",
]
filterwarnings = [
    "once:No records were available to test:UserWarning",
]
log_level = "INFO"
minversion = "9"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "COM812",   # missing-trailing-comma
    "PERF203",  # try/except in loop — needed to try multiple date formats
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# The bingads SOAP client and its suds factory objects are untyped, so `Any`
# is unavoidable at that boundary.
"tap_ticketswap_bing_ads/streams.py" = ["ANN401"]
"tests/*" = ["ANN", "S101", "INP001", "PLR2004"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"
