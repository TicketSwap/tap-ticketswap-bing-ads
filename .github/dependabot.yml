version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: pip
  directory: "/.github/workflows"
  schedule:
    interval: weekly

- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
  groups:
    pre-commit:
      patterns: ["*"]
